name: Build DLL and publish release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2025-vs2026 # depends on https://github.com/actions/runner-images/issues/13638

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup CMake
        uses: lukka/get-cmake@latest

      - name: Configure CMake with Visual Studio 2026
        run: cmake -S . -B build -G "Visual Studio 18 2026" -A x64

      - name: Build project
        run: cmake --build build --config Release

      - name: Find DLL
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Path build -Recurse -Filter "GarrysMod.dll" | Select-Object -First 1

          if (-not $dll) {
            Write-Error "GarrysMod.dll not found in build directory"
            exit 1
          }

          Copy-Item $dll.FullName "GarrysMod.dll"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: GarrysMod.dll
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}